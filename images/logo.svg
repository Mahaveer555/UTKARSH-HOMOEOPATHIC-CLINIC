<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8b6" />
      <stop offset="45%" stop-color="#dfb76c" />
      <stop offset="100%" stop-color="#b88836" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Emblem -->
  <g transform="translate(8, 8)">
    <circle cx="37" cy="37" r="36" fill="#0f241a" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="37" cy="37" r="33.5" fill="none" stroke="#d5b364" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6"/>

    <!-- Rising Sun Backdrop -->
    <path d="M 21 43 Q 37 25 53 43 Z" fill="url(#sunGrad)" opacity="0.6" />
    <!-- Sun Rays -->
    <line x1="37" y1="19" x2="37" y2="13" stroke="#fde047" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="29" y1="21" x2="25" y2="16" stroke="#fde047" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="45" y1="21" x2="49" y2="16" stroke="#fde047" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="23" y1="28" x2="17" y2="26" stroke="#fde047" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="51" y1="28" x2="57" y2="26" stroke="#fde047" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Uplifted Vital Human Figure -->
    <circle cx="37" cy="25" r="4.2" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    <path d="M 36 30 L 38 30 L 38.5 49 L 35.5 49 Z" fill="url(#goldGrad)" />
    <path d="M 36 32 Q 24 25 21 17 Q 23 21 36 34 Z" fill="url(#goldGrad)" />
    <path d="M 38 32 Q 50 25 53 17 Q 51 21 38 34 Z" fill="url(#goldGrad)" />

    <!-- Homoeopathic Natural Healing Leaves -->
    <path d="M 37 48 C 29 44 22 49 21 54 C 27 56 34 53 37 48 Z" fill="url(#leafGrad)" />
    <path d="M 37 48 C 45 44 52 49 53 54 C 47 56 40 53 37 48 Z" fill="url(#leafGrad)" />
    <circle cx="37" cy="48" r="1.5" fill="#fde047" />
  </g>

  <!-- Vertical Divider Line Matching Image -->
  <line x1="94" y1="14" x2="94" y2="76" stroke="#d5b364" stroke-width="1" opacity="0.35"/>

  <!-- Brand Typography -->
  <g transform="translate(108, 10)">
    <!-- Delicate Top Floral Ornament -->
    <path d="M 125 5 Q 132 -1 139 5 Q 132 2 125 5 Z" fill="url(#goldGrad)"/>
    <circle cx="132" cy="0" r="1.2" fill="url(#goldGrad)"/>
    <line x1="2" y1="12" x2="108" y2="12" stroke="#d5b364" stroke-width="0.8" opacity="0.45"/>
    <line x1="156" y1="12" x2="262" y2="12" stroke="#d5b364" stroke-width="0.8" opacity="0.45"/>

    <!-- Main Name UTKARSH -->
    <text x="132" y="44" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="32" font-weight="700" fill="#fcf9f2" letter-spacing="8" text-anchor="middle">UTKARSH</text>

    <!-- Subtitles in Crisp Legible Type -->
    <text x="132" y="60" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="8.8" font-weight="700" fill="#dfc699" letter-spacing="2.5" text-anchor="middle">HOMOEOPATHIC CLINIC AND</text>
    <text x="132" y="71" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="8.8" font-weight="700" fill="#dfc699" letter-spacing="2.5" text-anchor="middle">RESEARCH CENTRE</text>
  </g>
</svg>
